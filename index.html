    <script>
      // Gracefully silence expected AI Studio iframe HMR / WebSocket runner notices
      (function() {
        function shouldIgnore(msg) {
          if (!msg) return false;
          var str = String(msg);
          return str.includes('WebSocket') || 
                 str.includes('createWebSocketModuleRunnerTransport') || 
                 str.includes('@vite/client') || 
                 str.includes('vite:ws') ||
                 str.includes('failed to connect to websocket');
        }
        window.addEventListener('error', function(e) {
          if (shouldIgnore(e.message) || (e.error && shouldIgnore(e.error.message))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason && (e.reason.message || String(e.reason));
          if (shouldIgnore(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
